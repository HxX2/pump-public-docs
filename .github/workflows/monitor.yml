name: PumpDocs Monitor
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check_for_updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4

      - name: Compare Upstream Hash
        id: check
        run: |
          # 1. Fetch latest commit data from Pump.fun API
          RESPONSE=$(curl -s https://api.github.com/repos/pump-fun/pump-public-docs/commits/main)
          UPSTREAM_HASH=$(echo "$RESPONSE" | jq -r .sha)
          
          # 2. Get the last hash we saved
          touch last_seen_hash.txt
          LAST_HASH=$(cat last_seen_hash.txt)

          if [ "$UPSTREAM_HASH" != "$LAST_HASH" ]; then
            # Extract dynamic variables for the embed
            COMMIT_MSG=$(echo "$RESPONSE" | jq -r .commit.message | head -n 1)
            SHORT_SHA=$(echo "$UPSTREAM_HASH" | cut -c1-7)
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            # Export variables to Github Environment
            echo "NEW_CHANGES=true" >> $GITHUB_ENV
            echo "LATEST_SHA=$UPSTREAM_HASH" >> $GITHUB_ENV
            echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
            echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
            echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
            
            # Save state to file and push to fork
            echo "$UPSTREAM_HASH" > last_seen_hash.txt
            git config --global user.name "PumpWatcher"
            git config --global user.email "bot@pump.fun"
            git add last_seen_hash.txt
            git commit -m "Track: $SHORT_SHA"
            git push
          else
            echo "NEW_CHANGES=false" >> $GITHUB_ENV
          fi

      - name: Send Discord Notification
        if: env.NEW_CHANGES == 'true'
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [
                   {
                     "title": "🚨 Pump.fun Docs Updated!",
                     "description": "** **\n**Latest Commit**: `'"${{ env.COMMIT_MSG }}"'`\n**Commit**: ['"${{ env.SHORT_SHA }}"'](https://github.com/pump-fun/pump-public-docs/commit/'"${{ env.LATEST_SHA }}"')\n**​**",
                     "color": 15409955,
                     "footer": {
                       "text": "Github",
                       "icon_url": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQnHBPL3-ZZ6HDtDmOwax0Rump0IFOIRJgmg&s"
                     },
                     "timestamp": "'"${{ env.TIMESTAMP }}"'"
                   }
                 ]
               }' \
               ${{ secrets.DISCORD_WEBHOOK }}
